name: Publish Whenua website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare complete static website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html business-cards.html posters.html pull-up-banners.html flyers.html name-badges.html about.html _site/
          cp -R assets styles scripts _site/
          touch _site/.nojekyll
          test -s _site/business-cards.html
          test -s _site/posters.html
          test -s _site/flyers.html
          test -s _site/name-badges.html
          test -s _site/about.html
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
