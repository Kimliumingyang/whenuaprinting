<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Whenua · 网站预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#e7e9e3;color:#183c29;font:14px Arial,sans-serif}.workspace{display:grid;grid-template-columns:240px 1fr;height:100dvh}aside{padding:28px 20px;background:#fafbf7;border-right:1px solid #d7ddd1;overflow:auto}h1{font-size:23px;letter-spacing:-1px;margin:0 0 8px}p{font-size:13px;line-height:1.7;color:#697465;margin:0 0 28px}label{display:block;font-size:12px;font-weight:bold;margin:24px 0 9px}select,button,a.action{font:inherit;border:1px solid #cbd5c3;border-radius:7px;background:white;color:#20412a;padding:11px;width:100%;display:block}button{cursor:pointer;margin-top:12px}button.primary{color:white;background:#236b30;border-color:#236b30}a.action{text-decoration:none;text-align:center;margin-top:12px}button:hover,a.action:hover{filter:brightness(.95)}.note{font-size:12px;margin-top:25px;color:#78816f}.preview-area{display:flex;flex-direction:column;min-width:0;min-height:0}.toolbar{background:#f5f6f1;min-height:55px;border-bottom:1px solid #d7ddd1;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:12px}.stage{flex:1;min-height:0;overflow:hidden;padding:22px;display:flex;justify-content:center;align-items:flex-start}.frame-wrap{position:relative;background:white;box-shadow:0 5px 25px #24382022;overflow:hidden;border-radius:5px;flex:none}iframe{display:block;border:0;background:#f7f4e9;transform-origin:top left;max-width:none}#status{font-size:12px;color:#6f7c68;margin-top:16px;line-height:1.6}:focus-visible{outline:3px solid #7da448;outline-offset:3px}@media(max-width:700px){.workspace{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;border-right:0}h1{font-size:18px;margin:0;width:100%}aside>p,.note,aside label,#status{display:none}select,button,a.action{width:auto;flex:1;min-width:90px;font-size:12px;padding:9px;margin:0}select{max-width:48%}.toolbar{padding:10px 15px;min-height:40px}.stage{padding:12px}}
</style></head><body><div class="workspace"><aside><h1>Whenua · 网站预览</h1><p>选择页面，在右侧直接浏览、点击和检查效果。</p><label for="page">预览页面</label><select id="page"><option value="index.html">主页</option><option value="about.html">About us</option><option value="quote.html">正式询价页</option><option value="privacy-policy.html">Privacy Policy</option><option value="refund-policy.html">Refund Policy</option><option value="business-cards.html">名片</option><option value="flyers.html">传单</option><option value="posters.html">海报</option><option value="name-badges.html">姓名牌</option><option value="pull-up-banners.html">易拉宝</option></select><label for="device">屏幕宽度</label><select id="device"><option value="0">自适应窗口</option><option value="1440">电脑 · 1440px</option><option value="768">平板 · 768px</option><option value="390">手机 · 390px</option></select><button class="primary" id="refresh">刷新预览</button><button id="quote">打开询价弹窗</button><a class="action" id="open" href="index.html" target="_blank" rel="noopener">独立打开网页 ↗</a><div id="status" role="status">正在加载…</div><p class="note">这里显示真实网站。修改发布后刷新查看；预览页不会自动保存修改。</p></aside><section class="preview-area" aria-label="网站预览窗口"><div class="toolbar"><span id="location">index.html</span><span id="dimensions"></span></div><div class="stage" id="stage"><div class="frame-wrap" id="frameWrap"><iframe id="site" src="index.html" title="Whenua 网站实时预览"></iframe></div></div></section></div><script>
const frame=document.getElementById('site'),stage=document.getElementById('stage'),wrap=document.getElementById('frameWrap'),page=document.getElementById('page'),device=document.getElementById('device'),status=document.getElementById('status');
function resize(){const css=getComputedStyle(stage),available=stage.clientWidth-parseFloat(css.paddingLeft)-parseFloat(css.paddingRight),height=stage.clientHeight-parseFloat(css.paddingTop)-parseFloat(css.paddingBottom);if(available<=0||height<=0)return;const width=Number(device.value)||available,scale=Math.min(1,available/width);frame.style.width=width+'px';frame.style.height=height/scale+'px';frame.style.transform=`scale(${scale})`;wrap.style.width=width*scale+'px';wrap.style.height=height+'px';document.getElementById('dimensions').textContent=Math.round(width)+'px · '+Math.round(scale*100)+'%'}
function load(){status.textContent='正在加载…';frame.src=page.value;document.getElementById('open').href=page.value}
page.addEventListener('change',load);device.addEventListener('change',resize);new ResizeObserver(resize).observe(stage);
frame.addEventListener('load',()=>{try{const filename=frame.contentWindow.location.pathname.split('/').pop()||'index.html';if([...page.options].some(o=>o.value===filename))page.value=filename;document.getElementById('location').textContent=filename;document.getElementById('open').href=page.value;status.textContent='已加载，可在右侧操作网页。'}catch{status.textContent='页面已加载。'}resize()});
document.getElementById('refresh').onclick=()=>{status.textContent='正在刷新…';try{frame.contentWindow.location.reload()}catch{load()}};
document.getElementById('quote').onclick=()=>{try{const trigger=frame.contentDocument.querySelector('.quote-open');if(trigger){trigger.click();status.textContent='已打开询价弹窗。'}else{frame.contentDocument.getElementById('quoteForm').scrollIntoView();frame.contentDocument.getElementById('name').focus();status.textContent='已定位询价表单。'}}catch{status.textContent='页面尚未加载完成，请稍后再试。'}};resize();
</script></body></html>
